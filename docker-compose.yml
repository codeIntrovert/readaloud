services:
  db:
    image: pgvector/pgvector:pg16   # Postgres with pgvector ready for later
    environment: {POSTGRES_USER: tts, POSTGRES_PASSWORD: tts, POSTGRES_DB: tts}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U tts"], interval: 3s, retries: 20}
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tts:tts@db:5432/tts
    volumes: [audio:/data/audio]
    depends_on: {db: {condition: service_healthy}}
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
volumes: {pgdata: {}, audio: {}}
